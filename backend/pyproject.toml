[project]
name = "mdt-backend"
version = "0.1.0"
description = "MDT Copilot backend: FHIR data, AI interpretation, MDT records"
authors = [
    { name = "Yes-and", email = "72066894+Yes-and@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mdt-backend = "mdt_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
