# Fly.io deploy of the Dockerfile: `fly deploy` (needs Dataset/ + data/ai_cases/ locally, baked in).
# Patient data: the private IRIS app (iris/fly.toml). Secrets: `fly secrets set APP_PASSWORD=…
# FHIR_PASSWORD=<IRIS_PASSWORD of the IRIS app>`. Records live on the `records` volume.
app = "mdt-copilot-rakathon"
primary_region = "fra"

[env]
  FHIR_BASE_URL = "http://mdt-copilot-iris.internal:52773/fhir/r4"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop" # ponytail: sleeps when idle, ~2 s cold start; min_machines_running = 1 for a live demo
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "records"
  destination = "/app/data/records"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
